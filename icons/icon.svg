<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3ec17a" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Orion-like constellation motif -->
  <g stroke="#4a90d9" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="170" y1="150" x2="340" y2="165"/>
    <line x1="170" y1="150" x2="225" y2="255"/>
    <line x1="340" y1="165" x2="285" y2="245"/>
    <line x1="225" y1="255" x2="256" y2="250"/>
    <line x1="256" y1="250" x2="285" y2="245"/>
    <line x1="225" y1="255" x2="185" y2="365"/>
    <line x1="285" y1="245" x2="335" y2="355"/>
    <line x1="185" y1="365" x2="335" y2="355"/>
  </g>
  <g fill="#ffffff">
    <circle cx="170" cy="150" r="8" fill="#ffb86c"/>
    <circle cx="340" cy="165" r="7" fill="#a8d1ff"/>
    <circle cx="225" cy="255" r="6"/>
    <circle cx="256" cy="250" r="6"/>
    <circle cx="285" cy="245" r="6"/>
    <circle cx="185" cy="365" r="7"/>
    <circle cx="335" cy="355" r="9" fill="#9bbcff"/>
    <!-- Polaris-like top star -->
    <circle cx="256" cy="96" r="10" fill="#ffe680"/>
  </g>
</svg>
