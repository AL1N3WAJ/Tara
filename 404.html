<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Page not found — Akash</title>
  <!-- Redirect to index.html preserving the hash (for SPA-style links) -->
  <script>
    // For project pages served at /repo-name/, this ensures that any
    // path that GitHub Pages 404s on still loads the app.
    var seg = window.location.pathname.split('/').length - 1;
    var prefix = Array(seg).join('../');
    window.location.replace(prefix + 'index.html' + window.location.search + window.location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=./index.html"/>
</head>
<body>
  <p>Redirecting to <a href="./index.html">Akash Star Chart</a>…</p>
</body>
</html>
